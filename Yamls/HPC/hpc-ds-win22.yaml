apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hpc-ds-win
  namespace: demo
  labels:
    app: hpc-ds-win
spec:
  selector:
    matchLabels:
      name: hpc-ds-win
  template:
    metadata:
      labels:
        name: hpc-ds-win
    spec:
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\SYSTEM"
      hostNetwork: true
      containers:
      - name: hpc-ds-win
        image: princepereira/tcp-client-server:NC2022
        command: ["server.exe", "-p", "6666", "-pr", "All", "-swt", "5", "-awt", "5"]
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: kube-path
            mountPath: C:\k
      volumes:
      - name: kube-path
        hostPath:
          path: C:\k
      nodeSelector:
        kubernetes.azure.com/os-sku: Windows2022